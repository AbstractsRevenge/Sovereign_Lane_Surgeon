# CI exists so the results are verifiable by someone who is not the author. A test count in a
# README is a claim; a run on every push is evidence. Three things are proven here that no
# assertion in prose can be: the committed bundle matches its committed manifests, a real device
# seed works end to end from that bundle, and the slim (-tags nobundle) build still compiles.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The go directive in go.mod is a minimum, not a pin; CI runs what the author runs.
          go-version: stable
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '^internal/blueprint/' || true)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build (bundle embedded)
        run: go build -o sovereign-lane-surgeon .

      - name: Build (-tags nobundle, the slim binary)
        run: go build -tags nobundle -o sovereign-lane-surgeon-slim .

      - name: Binary sizes
        run: ls -la --block-size=M sovereign-lane-surgeon sovereign-lane-surgeon-slim | awk '{print $5, $9}'

      - name: Bundle self-consistency
        # Every committed file hashed against the committed manifest: proves the bundle in git is
        # exactly what the manifests describe, which is what every seed depends on.
        run: |
          ./sovereign-lane-surgeon bundle info
          ./sovereign-lane-surgeon bundle verify

      - name: Tests
        # `set -o pipefail` matters: GitHub runs each step with `bash -e`, not `-o pipefail`, so a
        # pipeline's exit status would be tail's and a failing suite would report success. Run once
        # and tee, rather than re-running the suite for a summary — it contains an end-to-end seed
        # that copies hundreds of megabytes.
        run: |
          set -o pipefail
          go test -v ./... 2>&1 | tee test-output.txt | grep -E '^(=== RUN|--- FAIL|ok|FAIL|panic)' | tail -40

      - name: Test summary
        if: always()
        run: |
          if [ ! -f test-output.txt ]; then echo "no test output" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          run_count=$(grep -c '^=== RUN' test-output.txt || true)
          fail_count=$(grep -c '^--- FAIL' test-output.txt || true)
          echo "### ${run_count} tests, ${fail_count} failed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(--- FAIL|ok |FAIL)' test-output.txt | head -40 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          if-no-files-found: ignore
